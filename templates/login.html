{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-4">

        <div class="dashboard-panel">

            <h3>Admin Login</h3>

            <form method="POST">

                <div class="mb-3">
                    <input
                        type="text"
                        class="form-control"
                        name="username"
                        placeholder="Username"
                    >
                </div>

                <div class="mb-3">
                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        placeholder="Password"
                    >
                </div>

                <button
                    class="btn btn-primary w-100"
                    type="submit"
                >
                    Login
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
