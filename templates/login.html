{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="glitch-form-wrapper">

    <form
        method="POST"
        action="{{ url_for('login') }}"
        class="glitch-card">

        <div class="card-header">

            <div class="card-title">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    fill="none">

                    <path d="M14 3v4a1 1 0 0 0 1 1h4"></path>

                    <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"></path>

                    <path d="M12 11.5a3 3 0 0 0 -3 2.824v1.176a3 3 0 0 0 6 0v-1.176a3 3 0 0 0 -3 -2.824z"></path>

                </svg>

                <span>SOC_LOGIN</span>

            </div>

            <div class="card-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

        <div class="card-body">

            <div class="form-group">

                <input
                    type="text"
                    id="username"
                    name="username"
                    required>

                <label
                    for="username"
                    class="form-label">

                    USERNAME

                </label>

            </div>

            <div class="form-group">

                <input
                    type="password"
                    id="password"
                    name="password"
                    required>

                <label
                    for="password"
                    class="form-label">

                    ACCESS_KEY

                </label>

            </div>

            <button
                type="submit"
                class="submit-btn">

                <span class="btn-text">

                    INITIATE_CONNECTION

                </span>

            </button>

        </div>

    </form>

</div>

{% endblock %}
