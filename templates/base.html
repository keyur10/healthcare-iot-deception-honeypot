<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Healthcare IoT SOC Dashboard
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    {% block extra_css %}
    {% endblock %}
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">

            <a
                class="navbar-brand fw-bold"
                href="{{ url_for('dashboard') }}"
            >
                🛡️ Healthcare IoT SOC
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarNav"
            >

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('dashboard') }}"
                        >
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('about') }}"
                        >
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('status') }}"
                        >
                            Status
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('api_stats') }}"
                        >
                            API
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    <main class="container-fluid py-4">

        {% block content %}
        {% endblock %}

    </main>

    <footer class="footer">
        <div class="container text-center">

            <hr>

            <p class="mb-1">
                Healthcare IoT Deception Honeypot Network
            </p>

            <small>
                Flask • Cowrie • MITRE ATT&CK • VirusTotal • Shodan
            </small>

        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>

    <script
        src="{{ url_for('static', filename='js/dashboard.js') }}">
    </script>

    <script
        src="{{ url_for('static', filename='js/charts.js') }}">
    </script>

    <script
        src="{{ url_for('static', filename='js/realtime.js') }}">
    </script>

    {% block extra_js %}
    {% endblock %}

</body>
</html>
