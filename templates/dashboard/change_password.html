{% extends "layouts/base.html" %}

{% block extra_css %}
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/change_password.css') }}"
>
{% endblock %}

{% block content %}

<div class="settings-container">

    <div class="page-header">

        <h1>Change Password</h1>

        <p>
            Update Password for {{ user.username }}
        </p>

    </div>

    <div class="settings-panel">

        <form
            action="{{ url_for('change_password', username=user.username) }}"
            method="POST"
        >

            <div class="settings-grid">

                <div class="setting-card">

                    <label>

                        New Password

                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                    >

                </div>

            </div>

            <button
                type="submit"
                class="save-btn"
            >
                Update Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
