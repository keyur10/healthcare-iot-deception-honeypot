{% extends "base.html" %}

{% block title %}
Settings
{% endblock %}

{% block content %}

<div class="dashboard-panel">

```
<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>

        <i class="fas fa-cogs"></i>

        System Settings

    </h2>

    <button class="btn btn-primary">

        Save Settings

    </button>

</div>

<!-- SECURITY -->

<div class="dashboard-panel mb-4">

    <h4>

        Security Policies

    </h4>

    <div class="form-check">

        <input class="form-check-input" type="checkbox" checked>

        <label class="form-check-label">

            Enable Multi-Factor Authentication (MFA)

        </label>

    </div>

    <div class="form-check">

        <input class="form-check-input" type="checkbox" checked>

        <label class="form-check-label">

            Force Password Complexity

        </label>

    </div>

    <div class="form-check">

        <input class="form-check-input" type="checkbox">

        <label class="form-check-label">

            Lock Account After Failed Logins

        </label>

    </div>

</div>

<!-- PASSWORD POLICY -->

<div class="dashboard-panel mb-4">

    <h4>

        Password Policy

    </h4>

    <div class="row">

        <div class="col-md-4">

            <label class="form-label">

                Minimum Length

            </label>

            <input
                type="number"
                class="form-control"
                value="12">

        </div>

        <div class="col-md-4">

            <label class="form-label">

                Password Expiry (Days)

            </label>

            <input
                type="number"
                class="form-control"
                value="90">

        </div>

        <div class="col-md-4">

            <label class="form-label">

                Login Attempts

            </label>

            <input
                type="number"
                class="form-control"
                value="5">

        </div>

    </div>

</div>

<!-- SESSION -->

<div class="dashboard-panel mb-4">

    <h4>

        Session Settings

    </h4>

    <div class="row">

        <div class="col-md-6">

            <label class="form-label">

                Session Timeout (Minutes)

            </label>

            <input
                type="number"
                class="form-control"
                value="240">

        </div>

        <div class="col-md-6">

            <label class="form-label">

                Auto Logout Inactive Users

            </label>

            <select class="form-select">

                <option>Enabled</option>
                <option>Disabled</option>

            </select>

        </div>

    </div>

</div>

<!-- EMAIL -->

<div class="dashboard-panel mb-4">

    <h4>

        Email Settings

    </h4>

    <div class="row">

        <div class="col-md-6">

            <label class="form-label">

                SMTP Server

            </label>

            <input
                type="text"
                class="form-control"
                placeholder="smtp.company.com">

        </div>

        <div class="col-md-6">

            <label class="form-label">

                SMTP Port

            </label>

            <input
                type="number"
                class="form-control"
                value="587">

        </div>

    </div>

    <div class="mt-3">

        <label class="form-label">

            Sender Email

        </label>

        <input
            type="email"
            class="form-control"
            placeholder="soc@company.com">

    </div>

</div>

<!-- REPORTS -->

<div class="dashboard-panel mb-4">

    <h4>

        Report Settings

    </h4>

    <div class="form-check">

        <input class="form-check-input" type="checkbox" checked>

        <label class="form-check-label">

            Enable PDF Reports

        </label>

    </div>

    <div class="form-check">

        <input class="form-check-input" type="checkbox" checked>

        <label class="form-check-label">

            Enable Excel Reports

        </label>

    </div>

    <div class="form-check">

        <input class="form-check-input" type="checkbox" checked>

        <label class="form-check-label">

            Enable CSV Reports

        </label>

    </div>

    <div class="form-check">

        <input class="form-check-input" type="checkbox">

        <label class="form-check-label">

            Automatically Email Reports

        </label>

    </div>

</div>

<!-- NOTIFICATIONS -->

<div class="dashboard-panel mb-4">

    <h4>

        Notifications

    </h4>

    <div class="form-check">

        <input class="form-check-input" type="checkbox" checked>

        <label class="form-check-label">

            Critical Attack Alerts

        </label>

    </div>

    <div class="form-check">

        <input class="form-check-input" type="checkbox" checked>

        <label class="form-check-label">

            User Management Alerts

        </label>

    </div>

    <div class="form-check">

        <input class="form-check-input" type="checkbox">

        <label class="form-check-label">

            System Health Alerts

        </label>

    </div>

</div>

<!-- BACKUP -->

<div class="dashboard-panel mb-4">

    <h4>

        Backup Settings

    </h4>

    <div class="row">

        <div class="col-md-6">

            <label class="form-label">

                Backup Frequency

            </label>

            <select class="form-select">

                <option>Daily</option>
                <option>Weekly</option>
                <option>Monthly</option>

            </select>

        </div>

        <div class="col-md-6">

            <label class="form-label">

                Retention Period (Days)

            </label>

            <input
                type="number"
                class="form-control"
                value="30">

        </div>

    </div>

</div>

<!-- BRANDING -->

<div class="dashboard-panel">

    <h4>

        Dashboard Branding

    </h4>

    <input
        type="text"
        class="form-control mb-3"
        value="Healthcare IoT Deception Honeypot Network">

    <input
        type="file"
        class="form-control">

</div>
```

</div>

{% endblock %}
