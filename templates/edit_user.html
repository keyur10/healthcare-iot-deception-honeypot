{% extends "base.html" %}

{% block title %}
Edit User
{% endblock %}

{% block content %}

<div class="dashboard-panel">

    <h2>
        <i class="fas fa-user-edit"></i>
        Edit User
    </h2>

    <form method="POST">

        <div class="mb-3">

            <label>Username</label>

            <input
                type="text"
                name="username"
                class="form-control"
                value="{{ username }}"
                required>

        </div>

        <div class="mb-3">

            <label>Role</label>

            <select
                name="role"
                class="form-select">

                <option
                    value="viewer"
                    {% if user.role == "viewer" %}selected{% endif %}>
                    Viewer
                </option>

                <option
                    value="analyst"
                    {% if user.role == "analyst" %}selected{% endif %}>
                    Analyst
                </option>

                <option
                    value="admin"
                    {% if user.role == "admin" %}selected{% endif %}>
                    Admin
                </option>

            </select>

        </div>

        <div class="form-check mb-3">

            <input
                type="checkbox"
                class="form-check-input"
                name="active"
                {% if user.active %}checked{% endif %}>

            <label class="form-check-label">
                Active User
            </label>

        </div>

        <div class="form-check mb-3">

            <input
                type="checkbox"
                class="form-check-input"
                name="mfa"
                {% if user.get('mfa', False) %}checked{% endif %}>

            <label class="form-check-label">
                Enable MFA
            </label>

        </div>

        <button
            type="submit"
            class="btn btn-success">

            Save Changes

        </button>

        <a
            href="{{ url_for('user_management') }}"
            class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
